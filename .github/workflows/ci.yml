name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package (checks the manifest, README links and ignored files)
        run: npx vsce package --out dotpilot.vsix
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: dotpilot-vsix
          path: dotpilot.vsix
          if-no-files-found: error

  # Pruebas en un VS Code real. Se dejan como informativas hasta ver que son estables en los runners.
  integration:
    name: Integration (VS Code, Windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run the integration suite (no Microsoft extensions)
        run: node test-integration/run.js sin-csharp
        env:
          # En los runners el watcher nativo de dotnet watch no ve los cambios de archivo a tiempo.
          DOTNET_USE_POLLING_FILE_WATCHER: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: test-integration/.results/
          if-no-files-found: ignore
